name: التحقق المستمر

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الشفرة
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص الأنماط
        run: npm run lint

      - name: فحص TypeScript
        run: npm run typecheck

      - name: اختبارات الوحدات
        run: npm run test

      - name: بناء الإنتاج
        run: npm run build
